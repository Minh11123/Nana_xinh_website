services:
  db:
    image: postgres:17-alpine
    container_name: nana-xinh-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nana_xinh}
      POSTGRES_USER: ${POSTGRES_USER:-nana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nana} -d ${POSTGRES_DB:-nana_xinh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nana-xinh-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nana_xinh}
      DB_USERNAME: ${POSTGRES_USER:-nana}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nana-xinh-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
