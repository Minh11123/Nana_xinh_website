spring:
  application:
    name: nana-xinh-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  jwt:
    secret: ${JWT_SECRET:dev-only-nana-xinh-secret-key-change-me-please}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@nanaxinh.vn}
      password: ${ADMIN_PASSWORD:admin123}
      name: ${ADMIN_NAME:Nana Admin}
